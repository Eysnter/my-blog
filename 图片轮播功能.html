<!DOCTYPE html>
<html lang="zh-CN" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>极简艺术 - 全屏高清壁纸轮播</title>
    <!-- Tailwind CSS 引入 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    animation: {
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    }
                }
            }
        }
    </script>
    <style>
        /* 隐藏滚动条 */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.1);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.5);
        }
        
        /* 强制图片容器全屏且无溢出 */
        .wallpaper-container {
            position: absolute;
            inset: 0;
            overflow: hidden;
            background-color: #0d0d0d;
        }

        /* 基础幻灯片样式 */
        .slide-item {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            z-index: 1;
            transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: none;
        }

        .slide-item.active {
            opacity: 1;
            z-index: 10;
            pointer-events: auto;
        }

        /* 1. 淡入淡出特效 (Fade) */
        .effect-fade .slide-item {
            transition-property: opacity;
        }

        /* 2. 缩放切换特效 (Zoom) */
        .effect-zoom .slide-item {
            transition-property: opacity, transform;
            transform: scale(1.08);
        }
        .effect-zoom .slide-item.active {
            transform: scale(1);
        }

        /* 3. 滑动切换特效 (Slide) */
        .effect-slide .slide-item {
            transition-property: opacity, transform;
            transform: translateX(100%);
        }
        .effect-slide .slide-item.active {
            transform: translateX(0);
        }
        /* 前一张在左侧等待 */
        .effect-slide .slide-item.prev-waiting {
            transform: translateX(-100%);
            opacity: 0;
        }

        /* 毛玻璃高级背景 */
        .glass-panel {
            background: rgba(15, 15, 20, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
    </style>
</head>
<body class="h-full w-full m-0 p-0 overflow-hidden select-none bg-zinc-950 text-white font-sans">

    <!-- 全屏壁纸主容器 -->
    <div id="wallpaperContainer" class="wallpaper-container effect-fade">
        <!-- 动态生成的壁纸滑块将插入到这里 -->
    </div>

    <!-- 顶端微型进度条 -->
    <div class="fixed top-0 left-0 w-full h-1 z-40 bg-white/10 pointer-events-none">
        <div id="progressBar" class="h-full bg-white/80 w-0 transition-all ease-linear duration-100"></div>
    </div>

    <!-- 左侧快捷微调区域（鼠标悬停触发更明显） -->
    <div class="fixed inset-y-0 left-0 w-24 flex items-center justify-start pl-6 z-30 group">
        <button id="prevBtn" class="p-4 rounded-full bg-black/30 hover:bg-white/20 text-white/75 hover:text-white transition-all transform -translate-x-12 group-hover:translate-x-0 opacity-0 group-hover:opacity-100 duration-300 focus:outline-none focus:ring-2 focus:ring-white/50 shadow-lg backdrop-blur-sm" title="上一张 (←)">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
        </button>
    </div>

    <!-- 右侧快捷微调区域 -->
    <div class="fixed inset-y-0 right-0 w-24 flex items-center justify-end pr-6 z-30 group">
        <button id="nextBtn" class="p-4 rounded-full bg-black/30 hover:bg-white/20 text-white/75 hover:text-white transition-all transform translate-x-12 group-hover:translate-x-0 opacity-0 group-hover:opacity-100 duration-300 focus:outline-none focus:ring-2 focus:ring-white/50 shadow-lg backdrop-blur-sm" title="下一张 (→)">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
        </button>
    </div>

    <!-- 右上角：折叠式高级配置中心控制面板 -->
    <div class="fixed top-6 right-6 z-40 flex flex-col items-end gap-3">
        <!-- 控制面板折叠触发按钮 -->
        <button id="toggleConfigBtn" class="p-3 rounded-xl glass-panel text-white/90 hover:text-white hover:scale-105 active:scale-95 transition-all shadow-xl flex items-center gap-2 focus:outline-none" title="打开/关闭配置面板">
            <svg id="configIcon" class="w-5 h-5 animate-spin-slow" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
            <span class="text-xs font-semibold tracking-wide">高级控制台</span>
        </button>

        <!-- 配置控制面板主体 -->
        <div id="configPanel" class="w-80 rounded-2xl glass-panel shadow-2xl p-5 flex flex-col gap-5 transform translate-y-2 opacity-0 pointer-events-none transition-all duration-300">
            <div class="flex items-center justify-between border-b border-white/10 pb-3">
                <h2 class="text-sm font-bold tracking-wider text-white/95 flex items-center gap-2">
                    <span class="inline-block w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                    WALLPAPER SETTINGS
                </h2>
                <button id="playPauseBtn" class="px-2.5 py-1 text-xs rounded-md bg-white/10 hover:bg-white/20 transition text-white/90 flex items-center gap-1.5" title="空格键可快捷切换状态">
                    <span id="playPauseText">暂停轮播</span>
                </button>
            </div>

            <!-- 配置项 1: 自动轮播开关 -->
            <div class="flex items-center justify-between text-xs">
                <div>
                    <p class="font-semibold text-white/90">自动轮播模式</p>
                    <p class="text-[10px] text-white/40">后台自动切换精美图片</p>
                </div>
                <label class="relative inline-flex items-center cursor-pointer">
                    <input type="checkbox" id="cfgAutoPlay" class="sr-only peer" checked>
                    <div class="w-9 h-5 bg-zinc-800 rounded-full peer peer-checked:after:translate-x-full after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-emerald-500"></div>
                </label>
            </div>

            <!-- 配置项 2: 轮播间隔时长 -->
            <div class="flex flex-col gap-1.5 text-xs">
                <div class="flex justify-between">
                    <span class="font-semibold text-white/90">切换间隔时间</span>
                    <span class="font-mono text-white/60" id="cfgIntervalVal">5 秒</span>
                </div>
                <input type="range" id="cfgInterval" min="2000" max="15000" step="500" value="5000" class="w-full h-1 bg-zinc-800 rounded-lg appearance-none cursor-pointer accent-emerald-400">
            </div>

            <!-- 配置项 3: 刷新自动更换壁纸 (随机首张) -->
            <div class="flex items-center justify-between text-xs">
                <div>
                    <p class="font-semibold text-white/90">加载随机首张</p>
                    <p class="text-[10px] text-white/40">每次刷新网页随机展示一张</p>
                </div>
                <label class="relative inline-flex items-center cursor-pointer">
                    <input type="checkbox" id="cfgRandom" class="sr-only peer" checked>
                    <div class="w-9 h-5 bg-zinc-800 rounded-full peer peer-checked:after:translate-x-full after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-emerald-500"></div>
                </label>
            </div>

            <!-- 配置项 4: 切换动画特效 -->
            <div class="flex flex-col gap-1.5 text-xs">
                <span class="font-semibold text-white/90">过渡动画特效</span>
                <div class="grid grid-cols-3 gap-2">
                    <button data-effect="fade" class="cfg-effect-btn px-2 py-1.5 rounded bg-white/15 border border-white/20 text-white text-center font-medium transition-all hover:bg-white/20">渐变</button>
                    <button data-effect="zoom" class="cfg-effect-btn px-2 py-1.5 rounded bg-zinc-900 border border-transparent text-white/55 text-center transition-all hover:text-white">缩放</button>
                    <button data-effect="slide" class="cfg-effect-btn px-2 py-1.5 rounded bg-zinc-900 border border-transparent text-white/55 text-center transition-all hover:text-white">滑动</button>
                </div>
            </div>

            <!-- 配置项 5: 填充模式 -->
            <div class="flex items-center justify-between text-xs">
                <div>
                    <p class="font-semibold text-white/90">图片填充模式</p>
                    <p class="text-[10px] text-white/40">Cover(剪裁铺满) / Contain(包含)</p>
                </div>
                <select id="cfgFit" class="bg-zinc-950 text-white border border-white/15 rounded-md px-2 py-1 text-xs focus:ring-1 focus:ring-emerald-400 focus:outline-none">
                    <option value="cover" selected>Cover (铺满)</option>
                    <option value="contain">Contain (全景)</option>
                </select>
            </div>

            <!-- 配置项 6: 快捷键状态指示 -->
            <div class="text-[10px] text-white/30 border-t border-white/10 pt-3 flex flex-col gap-0.5 leading-relaxed">
                <p>💡 快捷操作指南：</p>
                <p>• 左右方向键 [←] [→] 切换上一张/下一张</p>
                <p>• 空格键 [Space] 暂停或继续自动轮播</p>
                <p>• 手机端可向左/右滑动手势进行切换</p>
            </div>
        </div>
    </div>

    <!-- 左下角信息框：加载与说明 -->
    <div id="toastMessage" class="fixed bottom-6 left-6 z-40 px-4 py-2.5 rounded-xl glass-panel text-xs text-white/90 flex items-center gap-2 opacity-0 pointer-events-none transition-all duration-300 transform translate-y-2">
        <svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        <span id="toastText">配置生效中</span>
    </div>

    <script>
        // ==========================================
        // 核心壁纸轮播配置 (代码基础默认值)
        // ==========================================
        const DEFAULT_CONFIG = {
            // 壁纸资源列表 (全量高清图源)
            wallpapers: [
                "https://tc.alcy.cc/tc/20260121/27a5408f0f9763b05404c8c8e9bfd034.webp",
                "https://tc.alcy.cc/tc/20260121/e0133987b1f4d3f81271662bdcedbbd3.webp",
                "https://tc.alcy.cc/tc/20260121/90667b3e805d4070eb8254a437f56701.webp",
                "https://tc.alcy.cc/tc/20260121/1c0155509f5979907d5ab297da6b47ed.webp",
                "https://tc.alcy.cc/tc/20260121/11439d32205082c44f047a0a9d011815.webp",
                "https://tc.alcy.cc/tc/20260429/bb987bfe3cde592dcd045a7855ce94a9.webp",
                "https://tc.alcy.cc/tc/20260429/a36b581273df18cfb2cbaaeb7485c6c6.webp",
                "https://tc.alcy.cc/tc/20260121/1b2ac4412abb7b0f20d4a419bac2f73d.webp",
                "https://tc.alcy.cc/tc/20260121/c7d3e0cd25e25d0be5aac6453e37282f.webp"
            ],
            
            // 默认初始显示的壁纸索引 (从 0 开始算起，对应第 1 张)
            defaultIndex: 0,

            // 刷新网页时是否随机选择一张作为初始壁纸 (开启此项会覆盖 defaultIndex)
            randomizeOnLoad: true,

            // 是否开启自动轮播
            autoPlay: true,

            // 自动轮播的时间间隔 (单位：毫秒)
            interval: 5000,

            // 过渡效果: 'fade' (渐变) | 'zoom' (缩放) | 'slide' (滑动)
            transitionEffect: 'fade',

            // 动画过渡时间 (单位：毫秒，默认 1 秒)
            transitionDuration: 1000,

            // 背景图片填充模式: 'cover' (裁剪铺满) | 'contain' (完整显示)
            backgroundSize: 'cover',

            // 是否开启键盘控制 (左右方向键切换，空格键暂停)
            keyboardControls: true,

            // 是否支持手机端触屏左右滑动切换
            touchControls: true
        };

        // ==========================================
        // 核心运行状态管理
        // ==========================================
        let appState = {
            currentIndex: 0,
            isPlaying: false,
            autoPlayTimer: null,
            progressInterval: null,
            progressPercent: 0,
            isPanelOpen: false,
            touchStartX: 0,
            touchEndX: 0,
            // 实时配置对象 (初始化为默认配置)
            currentConfig: { ...DEFAULT_CONFIG }
        };

        // DOM 元素引用
        const container = document.getElementById('wallpaperContainer');
        const dotsContainer = document.getElementById('dotIndicators');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const progressBar = document.getElementById('progressBar');
        const currentIndexDisplay = document.getElementById('currentIndexDisplay');
        const totalIndexDisplay = document.getElementById('totalIndexDisplay');
        
        // 控制面板 UI 元素
        const toggleConfigBtn = document.getElementById('toggleConfigBtn');
        const configPanel = document.getElementById('configPanel');
        const configIcon = document.getElementById('configIcon');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const playPauseText = document.getElementById('playPauseText');
        const cfgAutoPlay = document.getElementById('cfgAutoPlay');
        const cfgInterval = document.getElementById('cfgInterval');
        const cfgIntervalVal = document.getElementById('cfgIntervalVal');
        const cfgRandom = document.getElementById('cfgRandom');
        const cfgFit = document.getElementById('cfgFit');
        const effectBtns = document.querySelectorAll('.cfg-effect-btn');
        const toast = document.getElementById('toastMessage');
        const toastText = document.getElementById('toastText');

        // ==========================================
        // 应用初始化
        // ==========================================
        function initApp() {
            const cfg = appState.currentConfig;
            
            // 1. 设置初始图片索引
            if (cfg.randomizeOnLoad) {
                appState.currentIndex = Math.floor(Math.random() * cfg.wallpapers.length);
                showToast("刷新自动随机加载: 第 " + (appState.currentIndex + 1) + " 张");
            } else {
                appState.currentIndex = (cfg.defaultIndex >= 0 && cfg.defaultIndex < cfg.wallpapers.length) ? cfg.defaultIndex : 0;
            }

            // 2. 渲染壁纸 DOM 与点指示器
            renderWallpapers();
            renderIndicators();

            // 3. 将默认配置同步到 UI 控制台面板上
            syncConfigToUI();

            // 4. 应用动效模式与填充模式
            applyContainerEffectClass(cfg.transitionEffect);
            applyWallpaperFitStyle(cfg.backgroundSize);

            // 5. 绑定各类系统事件
            bindEvents();

            // 6. 激活首张壁纸
            changeToSlide(appState.currentIndex, false);

            // 7. 若开启自动轮播，则启动它
            if (cfg.autoPlay) {
                startAutoPlay();
            }
        }

        // ==========================================
        // DOM 元素渲染逻辑
        // ==========================================
        function renderWallpapers() {
            container.innerHTML = '';
            const cfg = appState.currentConfig;
            
            cfg.wallpapers.forEach((url, index) => {
                const slide = document.createElement('div');
                slide.className = 'slide-item';
                slide.setAttribute('data-index', index);
                
                // 设置过渡持续时间
                slide.style.transitionDuration = `${cfg.transitionDuration}ms`;

                // 创建主壁纸图片元素
                const img = document.createElement('img');
                img.src = url;
                img.alt = `Wallpaper ${index + 1}`;
                img.className = 'w-full h-full object-cover transition-all duration-300';
                
                // 加载骨架屏/微弱过渡处理
                img.style.opacity = '0';
                img.onload = () => {
                    img.style.opacity = '1';
                };
                
                // 图片加载容错处理
                img.onerror = () => {
                    console.error(`壁纸加载失败: ${url}`);
                    // 容错处理：替换成极简大气的纯黑渐变底图，并提供文本
                    const placeholder = document.createElement('div');
                    placeholder.className = 'absolute inset-0 flex flex-col items-center justify-center bg-gradient-to-tr from-zinc-900 to-zinc-800 text-white/40 p-4 text-center';
                    placeholder.innerHTML = `
                        <svg class="w-12 h-12 mb-3 text-white/10 animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                        <p class="text-sm font-semibold text-white/30">Artistic Wallpaper #${index + 1}</p>
                        <p class="text-[10px] text-white/20 mt-1">此资源在第三方图床加载超时，已提供优雅优雅容错展示</p>
                    `;
                    slide.innerHTML = '';
                    slide.appendChild(placeholder);
                };

                slide.appendChild(img);
                container.appendChild(slide);
            });

            if (totalIndexDisplay) {
                totalIndexDisplay.textContent = cfg.wallpapers.length;
            }
        }

        function renderIndicators() {
            if (!dotsContainer) return;
            dotsContainer.innerHTML = '';
            const cfg = appState.currentConfig;
            
            cfg.wallpapers.forEach((_, index) => {
                const dot = document.createElement('button');
                dot.className = `h-2 rounded-full bg-white/30 transition-all duration-300 hover:bg-white/60 focus:outline-none`;
                // 默认普通圆点宽 w-2，激活宽 w-6
                dot.style.width = '8px';
                dot.setAttribute('data-target-index', index);
                dot.title = `切换至第 ${index + 1} 张壁纸`;
                
                dot.addEventListener('click', () => {
                    changeToSlide(index);
                });
                
                dotsContainer.appendChild(dot);
            });
        }

        // ==========================================
        // 壁纸核心过渡逻辑
        // ==========================================
        function changeToSlide(targetIndex, resetProgress = true) {
            const cfg = appState.currentConfig;
            const slides = document.querySelectorAll('.slide-item');
            if (slides.length === 0) return;

            // 限制并校准索引界限
            let nextIndex = targetIndex;
            if (nextIndex >= cfg.wallpapers.length) {
                nextIndex = 0;
            } else if (nextIndex < 0) {
                nextIndex = cfg.wallpapers.length - 1;
            }

            const prevIndex = appState.currentIndex;

            // 当切换效果为滑动(slide)时，需辅助设置前置类名，防止滑动折回不顺滑
            if (cfg.transitionEffect === 'slide') {
                slides.forEach((slide, i) => {
                    slide.classList.remove('prev-waiting');
                    if (i < nextIndex) {
                        slide.classList.add('prev-waiting');
                    }
                });
            }

            // 切换激活的幻灯片
            slides.forEach((slide, i) => {
                if (i === nextIndex) {
                    slide.classList.add('active');
                } else {
                    slide.classList.remove('active');
                }
            });

            // 切换指示器圆点状态 (如果存在)
            if (dotsContainer) {
                const dots = dotsContainer.querySelectorAll('button');
                dots.forEach((dot, i) => {
                    if (i === nextIndex) {
                        dot.classList.add('bg-white');
                        dot.classList.remove('bg-white/30');
                        dot.style.width = '24px'; // 伸长突出激活
                    } else {
                        dot.classList.add('bg-white/30');
                        dot.classList.remove('bg-white');
                        dot.style.width = '8px';
                    }
                });
            }

            // 更新状态
            appState.currentIndex = nextIndex;
            if (currentIndexDisplay) {
                currentIndexDisplay.textContent = nextIndex + 1;
            }

            // 重新开始计时进度
            if (resetProgress && appState.isPlaying) {
                startAutoPlay();
            }
        }

        // ==========================================
        // 自动播放与进度条引擎
        // ==========================================
        function startAutoPlay() {
            stopAutoPlay(); // 先清除已有运行定时
            
            const cfg = appState.currentConfig;
            if (!cfg.autoPlay) return;

            appState.isPlaying = true;
            updatePlayPauseButtonUI();

            appState.progressPercent = 0;
            const tickRate = 50; // 每 50 毫秒更新一次进度条，保证顺滑
            const increment = (tickRate / cfg.interval) * 100;

            // 进度条渲染逻辑
            appState.progressInterval = setInterval(() => {
                appState.progressPercent += increment;
                if (appState.progressPercent >= 100) {
                    appState.progressPercent = 100;
                    progressBar.style.width = '100%';
                    clearInterval(appState.progressInterval);
                    // 到达 100% 执行下一张切换
                    changeToSlide(appState.currentIndex + 1, true);
                } else {
                    progressBar.style.width = `${appState.progressPercent}%`;
                }
            }, tickRate);
        }

        function stopAutoPlay() {
            appState.isPlaying = false;
            updatePlayPauseButtonUI();
            
            if (appState.progressInterval) {
                clearInterval(appState.progressInterval);
            }
            progressBar.style.width = '0%';
            appState.progressPercent = 0;
        }

        // 刷新播放/暂停按钮视觉状态
        function updatePlayPauseButtonUI() {
            if (appState.isPlaying) {
                playPauseBtn.className = "px-2.5 py-1 text-xs rounded-md bg-white/10 hover:bg-white/20 transition text-white/90 flex items-center gap-1.5";
                playPauseText.textContent = "暂停轮播";
            } else {
                playPauseBtn.className = "px-2.5 py-1 text-xs rounded-md bg-emerald-500/20 hover:bg-emerald-500/30 transition text-emerald-300 flex items-center gap-1.5 border border-emerald-500/30";
                playPauseText.textContent = "启动轮播";
            }
        }

        // ==========================================
        // 配置与界面微调映射
        // ==========================================
        function syncConfigToUI() {
            const cfg = appState.currentConfig;
            
            cfgAutoPlay.checked = cfg.autoPlay;
            cfgInterval.value = cfg.interval;
            cfgIntervalVal.textContent = `${cfg.interval / 1000} 秒`;
            cfgRandom.checked = cfg.randomizeOnLoad;
            cfgFit.value = cfg.backgroundSize;

            // 高亮对应动画模式按钮
            effectBtns.forEach(btn => {
                const eff = btn.getAttribute('data-effect');
                if (eff === cfg.transitionEffect) {
                    btn.className = "cfg-effect-btn px-2 py-1.5 rounded bg-emerald-500/20 border border-emerald-500 text-emerald-300 text-center font-medium transition-all";
                } else {
                    btn.className = "cfg-effect-btn px-2 py-1.5 rounded bg-zinc-900 border border-transparent text-white/55 text-center transition-all hover:text-white";
                }
            });
        }

        function applyContainerEffectClass(effect) {
            container.className = 'wallpaper-container';
            container.classList.add(`effect-${effect}`);
        }

        function applyWallpaperFitStyle(fit) {
            const items = container.querySelectorAll('img');
            items.forEach(img => {
                if (fit === 'contain') {
                    img.className = 'w-full h-full object-contain transition-all duration-300';
                } else {
                    img.className = 'w-full h-full object-cover transition-all duration-300';
                }
            });
        }

        // ==========================================
        // 用户交互事件绑定
        // ==========================================
        function bindEvents() {
            // 下一张 / 上一张 按钮点击
            prevBtn.addEventListener('click', () => changeToSlide(appState.currentIndex - 1));
            nextBtn.addEventListener('click', () => changeToSlide(appState.currentIndex + 1));

            // 折叠控制面板切换
            toggleConfigBtn.addEventListener('click', () => {
                appState.isPanelOpen = !appState.isPanelOpen;
                if (appState.isPanelOpen) {
                    configPanel.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-2');
                    configPanel.classList.add('opacity-100', 'pointer-events-auto', 'translate-y-0');
                    configIcon.classList.add('text-emerald-400');
                } else {
                    configPanel.classList.add('opacity-0', 'pointer-events-none', 'translate-y-2');
                    configPanel.classList.remove('opacity-100', 'pointer-events-auto', 'translate-y-0');
                    configIcon.classList.remove('text-emerald-400');
                }
            });

            // 点击面板外部自动折叠控制面板
            document.addEventListener('click', (e) => {
                if (appState.isPanelOpen && !configPanel.contains(e.target) && !toggleConfigBtn.contains(e.target)) {
                    toggleConfigBtn.click();
                }
            });

            // 暂停播放按钮
            playPauseBtn.addEventListener('click', () => {
                if (appState.isPlaying) {
                    stopAutoPlay();
                    showToast("已暂停自动轮播");
                } else {
                    appState.currentConfig.autoPlay = true;
                    cfgAutoPlay.checked = true;
                    startAutoPlay();
                    showToast("已启动自动轮播");
                }
            });

            // UI 动态修改: 自动轮播开关
            cfgAutoPlay.addEventListener('change', (e) => {
                appState.currentConfig.autoPlay = e.target.checked;
                if (e.target.checked) {
                    startAutoPlay();
                    showToast("轮播模式：开启");
                } else {
                    stopAutoPlay();
                    showToast("轮播模式：关闭");
                }
            });

            // UI 动态修改: 切换间隔
            cfgInterval.addEventListener('input', (e) => {
                const val = parseInt(e.target.value);
                appState.currentConfig.interval = val;
                cfgIntervalVal.textContent = `${val / 1000} 秒`;
            });
            cfgInterval.addEventListener('change', () => {
                showToast(`自动切换间隔设定为: ${appState.currentConfig.interval / 1000}s`);
                if (appState.isPlaying) {
                    startAutoPlay(); // 触发重新计时
                }
            });

            // UI 动态修改: 刷新随机首张
            cfgRandom.addEventListener('change', (e) => {
                appState.currentConfig.randomizeOnLoad = e.target.checked;
                showToast(`刷新随机首张：${e.target.checked ? '开启' : '关闭'}`);
            });

            // UI 动态修改: 切换效果按钮组
            effectBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    const eff = btn.getAttribute('data-effect');
                    appState.currentConfig.transitionEffect = eff;
                    
                    // 应用特效类
                    applyContainerEffectClass(eff);
                    
                    // 刷新高亮
                    syncConfigToUI();
                    showToast(`动画过渡效果已设为: ${btn.textContent}`);
                    
                    // 稍微重置并刷新当前帧
                    changeToSlide(appState.currentIndex, false);
                });
            });

            // UI 动态修改: 填充模式
            cfgFit.addEventListener('change', (e) => {
                const mode = e.target.value;
                appState.currentConfig.backgroundSize = mode;
                applyWallpaperFitStyle(mode);
                showToast(`填充模式已切换为：${mode === 'contain' ? '全景 (Contain)' : '铺满 (Cover)'}`);
            });

            // 键盘快捷键监听
            if (appState.currentConfig.keyboardControls) {
                document.addEventListener('keydown', (e) => {
                    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
                        changeToSlide(appState.currentIndex + 1);
                    } else if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
                        changeToSlide(appState.currentIndex - 1);
                    } else if (e.key === ' ') {
                        e.preventDefault(); // 阻止空格键页面滚动
                        playPauseBtn.click();
                    }
                });
            }

            // 触屏滑动支持 (左右滑动)
            if (appState.currentConfig.touchControls) {
                document.addEventListener('touchstart', (e) => {
                    appState.touchStartX = e.changedTouches[0].screenX;
                }, { passive: true });

                document.addEventListener('touchend', (e) => {
                    appState.touchEndX = e.changedTouches[0].screenX;
                    handleSwipeGesture();
                }, { passive: true });
            }
        }

        // 识别左右滑动手势
        function handleSwipeGesture() {
            const threshold = 50; // 滑动最小距离判定限制 (px)
            const diff = appState.touchEndX - appState.touchStartX;
            
            if (Math.abs(diff) > threshold) {
                if (diff > 0) {
                    // 向右滑动 -> 上一张
                    changeToSlide(appState.currentIndex - 1);
                    showToast("手势切换：上一张");
                } else {
                    // 向左滑动 -> 下一张
                    changeToSlide(appState.currentIndex + 1);
                    showToast("手势切换：下一张");
                }
            }
        }

        // ==========================================
        // 便捷提示提示反馈 (Toast)
        // ==========================================
        let toastTimer = null;
        function showToast(text) {
            toastText.textContent = text;
            toast.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-2');
            toast.classList.add('opacity-100', 'pointer-events-auto', 'translate-y-0');

            if (toastTimer) clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                toast.classList.add('opacity-0', 'pointer-events-none', 'translate-y-2');
                toast.classList.remove('opacity-100', 'pointer-events-auto', 'translate-y-0');
            }, 2500);
        }

        // 启动系统
        window.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
