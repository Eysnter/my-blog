# Static Astro site for blog.eysnter.cn.
# The generated files are deployed to /srv/myweb and labelled
# httpd_sys_content_t so nginx can read them while SELinux is enforcing.
server {
    listen 80;
    listen [::]:80;
    server_name blog.eysnter.cn;

    root /srv/myweb;
    index index.html;
    charset utf-8;

    access_log /var/log/nginx/blog.eysnter.cn.access.log;
    error_log  /var/log/nginx/blog.eysnter.cn.error.log;

    # Astro generates directory-style routes such as /about/index.html.
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Hashed build assets can be cached; documents remain revalidatable.
    location ~* \.(?:css|js|mjs|woff2?|ttf|otf|png|jpe?g|gif|webp|avif|svg|ico|mp3|ogg|wav)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location ~* \.(?:html|xml|json)$ {
        expires -1;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
